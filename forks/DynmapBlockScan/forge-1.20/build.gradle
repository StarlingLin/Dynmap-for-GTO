buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'io.github.goooler.shadow'

eclipse {
    project {
        name = "${parent.name}-forge-1.20"
    }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = JavaLanguageVersion.of(17) // Need this here so eclipse task generates correctly.

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

ext.buildNumber = System.getenv().BUILD_NUMBER ?: "Dev"

minecraft {
    mappings channel: 'official', version: '1.20.1'
    //accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

project.archivesBaseName = "${parent.name}-forge-1.20"

dependencies {
    compileOnly project(':DynmapCoreAPI')
    implementation project(path: ":core")
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
}

processResources
{
    filesMatching('META-INF/mods.toml') {
        // replace version and mcversion
        expand(
            version: project.version,
            mcversion: "1.20.1"
        )
    }
}

shadowJar {
    dependencies {
        include(dependency(':core'))
        exclude(dependency("us.dynmap:DynmapCoreAPI"))
        exclude("META-INF/maven/**")
        exclude("META-INF/services/**")
        exclude("com/electronwill/**")
    }

    archiveFileName = "DynmapBlockScan-${project.version}-forge-1.20.1.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
}

shadowJar.doLast {
    task ->
        ant.checksum file: task.archiveFile.get().asFile
}

afterEvaluate {
reobf {
    shadowJar {
        mappings = createMcpToSrg.output
    }
}
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    archiveClassifier = 'dev'
}

artifacts {
    archives deobfJar
}

build.dependsOn(shadowJar)

