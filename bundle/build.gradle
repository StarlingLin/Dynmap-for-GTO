import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

version = '0.1.3'
dependencies { compileOnly 'net.minecraftforge:javafmllanguage:1.20.1-47.4.20' }
def componentVersions = providers.provider {
    [version: project.version.toString(),
     dynmapVersion: project(':dynmap-forge').version.toString(),
     blockscanVersion: project(':blockscan-forge').version.toString()]
}
processResources {
    inputs.properties(componentVersions.get())
    filesMatching('META-INF/mods.toml') { expand(componentVersions.get()) }
}
def components = [
    [project: ':dynmap-forge', artifact: 'dynmap-gto', file: 'dynmap-gto.jar'],
    [project: ':blockscan-forge', artifact: 'dynmapblockscan-gto', file: 'dynmapblockscan-gto.jar']
]
def metadata = layout.buildDirectory.file('generated/jarjar/META-INF/jarjar/metadata.json')
tasks.register('jarJarMetadata') {
    inputs.property('versions', components.collect { project(it.project).version.toString() })
    outputs.file(metadata)
    doLast {
        def jars = components.collect { c ->
            def v = project(c.project).version.toString()
            [identifier: [group: 'local.gto.dynmap', artifact: c.artifact],
             version: [range: '[' + v + ']', artifactVersion: v],
             path: 'META-INF/jarjar/' + c.file, isObfuscated: true]
        }
        metadata.get().asFile.parentFile.mkdirs()
        metadata.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([jars: jars]))
    }
}
tasks.named('jar') {
    dependsOn 'jarJarMetadata', ':dynmap-forge:reobfShadowJar', ':blockscan-forge:reobfShadowJar'
    archiveFileName = "Dynmap-for-GTO-${project.version}-forge-1.20.1.jar"
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    manifest { attributes('FMLModType': 'MOD', 'Implementation-Version': project.version) }
    from(layout.buildDirectory.dir('generated/jarjar'))
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    components.each { c ->
        from({ project(c.project).tasks.named('shadowJar').get().archiveFile.get().asFile }) {
            into 'META-INF/jarjar'
            rename { c.file }
        }
    }
}
tasks.register('verifyBundle') {
    dependsOn 'jar'
    doLast {
        new ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { z ->
            def data = new JsonSlurper().parse(z.getInputStream(z.getEntry('META-INF/jarjar/metadata.json')))
            assert data.jars.size() == 2
            assert z.getEntry('local/gto/dynmap/DynmapForGTO.class') != null
            def outerToml = z.getInputStream(z.getEntry('META-INF/mods.toml')).getText('UTF-8')
            def dependencyRanges = [:]
            outerToml.split(/(?m)^\[\[dependencies\.dynmap_for_gto\]\]\s*$/).drop(1).each { section ->
                def id = section =~ /(?m)^modId\s*=\s*"([^"]+)"\s*$/
                def range = section =~ /(?m)^versionRange\s*=\s*"([^"]+)"\s*$/
                assert id.find() && range.find() : 'Invalid outer dependency declaration'
                assert !dependencyRanges.containsKey(id.group(1)) : 'Duplicate outer dependency: ' + id.group(1)
                dependencyRanges[id.group(1)] = range.group(1)
            }
            data.jars.each { c ->
                assert z.getEntry(c.path) != null
                assert c.version.range == '[' + c.version.artifactVersion + ']'
                def entries = [:]
                new java.util.zip.ZipInputStream(z.getInputStream(z.getEntry(c.path))).withCloseable { nested ->
                    java.util.zip.ZipEntry entry
                    while ((entry = nested.nextEntry) != null) {
                        if (entry.name == 'META-INF/mods.toml') entries[entry.name] = nested.readAllBytes()
                        else entries[entry.name] = null
                    }
                }
                def declaredVersion = new String(entries['META-INF/mods.toml'], 'UTF-8')
                assert declaredVersion.contains('version="' + c.version.artifactVersion + '"') : 'Component version mismatch: ' + c.identifier.artifact
                def scan = c.identifier.artifact == 'dynmapblockscan-gto'
                def modId = scan ? 'dynmapblockscan' : 'dynmap'
                def expectedRange = '[' + c.version.artifactVersion + ']'
                assert dependencyRanges[modId] == expectedRange : 'Outer dependency mismatch: ' + modId +
                    ' requires ' + dependencyRanges[modId] + ', nested component is ' + c.version.artifactVersion
                def pkg = scan ? 'org/dynmapblockscan/forge_1_20/' : 'org/dynmap/forge_1_20/'
                assert entries.containsKey(pkg + 'NestedJarAccess.class')
                assert entries.containsKey(pkg + (scan ? 'DynmapBlockScanMod.class' : 'DynmapMod.class'))
                assert entries.containsKey('org/dynmap/modsupport/GeneratedTextures.class') == !scan : 'Generated texture API must exist only in Dynmap'
                assert entries.containsKey('org/dynmap/modsupport/compat/ae2/AeCableCatalog.class') == !scan
                if (scan) {
                    ['ae2/AeCableAdapter', 'gtceu/GtCableAdapter', 'gtceu/GtceuAdapter', 'gtocore/GtoCoreModels', 'gtmthings/GtmThingsModels', 'extendedae/ExtendedAeModels'].each {
                        assert entries.containsKey(pkg + 'compat/' + it + '.class') : 'Mod adapter missing: ' + it
                    }
                    assert entries.keySet().any { it.startsWith('assets/') } : 'Scanner model assets missing'
                } else {
                    ['gtceu/GtCableRenderer', 'ae2/AeCableRenderer'].each {
                        assert entries.containsKey('org/dynmap/hdmap/renderer/compat/' + it + '.class')
                    }
                    ['gtceu/GtCableSnapshot', 'ae2/AeCableSnapshot'].each {
                        assert entries.containsKey(pkg + 'compat/' + it + '.class')
                    }
                    assert entries.containsKey('extracted/web/index.html') : 'Dynmap web UI missing'
                    assert entries.keySet().any { it.startsWith('texturepacks/standard/') } : 'Dynmap standard textures missing'
                }
            }
        }
        logger.lifecycle('Bundle verified: outer dependencies, two nested component JARs, and matching version ranges.')
    }
}
