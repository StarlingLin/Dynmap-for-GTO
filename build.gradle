plugins {
    id 'base'
    id 'io.github.goooler.shadow' version '8.1.7' apply false
}
ext.globals = [buildNumber: 'gto3']
allprojects {
    group = 'local.gto.dynmap'
    version = '0.1.3'
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://repo.mikeprimm.com' }
    }
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'io.github.goooler.shadow'
    version = name in ['core', 'blockscan-forge'] ? '3.6-gto.3' : '3.7-beta-6-gto.3'
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(ProcessResources).configureEach { inputs.property('modVersion', provider { project.version.toString() }) }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
tasks.named('assemble') { dependsOn ':bundle:jar' }
tasks.named('check') { dependsOn ':bundle:verifyBundle' }

tasks.named('check') { dependsOn ':verification:test' }
